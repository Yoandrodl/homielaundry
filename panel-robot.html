<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dashboard Homie Bot</title>
    <!-- Telegram WebApp JS -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Tailwind CSS (CDN for quick styling) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* Menggunakan warna tema Telegram secara dinamis */
        body {
            background-color: var(--tg-theme-bg-color, #f3f4f6);
            color: var(--tg-theme-text-color, #1f2937);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            user-select: none; /* Mencegah seleksi teks seperti app native */
        }
        
        .card {
            background-color: var(--tg-theme-secondary-bg-color, #ffffff);
            border: 1px solid var(--tg-theme-hint-color, #e5e7eb);
        }

        .btn-primary {
            background-color: var(--tg-theme-button-color, #3b82f6);
            color: var(--tg-theme-button-text-color, #ffffff);
        }

        .btn-primary:active {
            opacity: 0.8;
            transform: scale(0.98);
        }

        .btn-danger {
            background-color: #ef4444;
            color: #ffffff;
        }

        .btn-danger:active {
            opacity: 0.8;
            transform: scale(0.98);
        }

        .btn-success {
            background-color: #10b981;
            color: #ffffff;
        }

        .btn-success:active {
            opacity: 0.8;
            transform: scale(0.98);
        }
    </style>
</head>
<body class="min-h-screen p-4 flex flex-col items-center">

    <!-- Header Section -->
    <div class="w-full max-w-md mt-2 mb-6 text-center">
        <div class="w-20 h-20 bg-blue-100 rounded-full flex items-center justify-center mx-auto mb-3 shadow-sm">
            <i class="fa-solid fa-robot text-4xl text-blue-500"></i>
        </div>
        <h1 class="text-2xl font-bold">HomieBot Control</h1>
        <p class="text-sm opacity-70 mt-1" id="user-info">Menunggu koneksi Telegram...</p>
    </div>

    <!-- Action Buttons Grid -->
    <div class="w-full max-w-md grid grid-cols-1 gap-4">
        
        <!-- Tombol 1: Rekap Manual -->
        <button onclick="sendAction('REKAP_NOW')" class="card btn-primary w-full p-5 rounded-2xl shadow-sm flex items-center justify-between transition-all">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 rounded-full bg-white/20 flex items-center justify-center text-xl">
                    <i class="fa-solid fa-file-invoice"></i>
                </div>
                <div class="text-left">
                    <h2 class="font-bold text-lg">Rekap Lembur WA</h2>
                    <p class="text-xs opacity-80">Tarik data WA & rekap ke Sheet sekarang</p>
                </div>
            </div>
            <i class="fa-solid fa-chevron-right opacity-50"></i>
        </button>

        <!-- Tombol 2: Cek Mutasi BCA (Placeholder for Phase 2) -->
        <button onclick="sendAction('CEK_BCA')" class="card btn-success w-full p-5 rounded-2xl shadow-sm flex items-center justify-between transition-all">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 rounded-full bg-white/20 flex items-center justify-center text-xl">
                    <i class="fa-solid fa-building-columns"></i>
                </div>
                <div class="text-left">
                    <h2 class="font-bold text-lg">Cek Mutasi BCA</h2>
                    <p class="text-xs opacity-80">Jalankan robot KlikBCA (BETA)</p>
                </div>
            </div>
            <i class="fa-solid fa-chevron-right opacity-50"></i>
        </button>

        <!-- Tombol 3: Buka Google Sheet -->
        <a href="https://docs.google.com/spreadsheets/d/1dSYUiqdhOjnrQye98Dcq8ONPN5Nay6IlHWzhYp_Vl3I/edit" target="_blank" class="card w-full p-5 rounded-2xl shadow-sm flex items-center justify-between transition-all active:scale-95 text-inherit no-underline">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 rounded-full bg-green-100 flex items-center justify-center text-xl text-green-600">
                    <i class="fa-solid fa-table"></i>
                </div>
                <div class="text-left">
                    <h2 class="font-bold text-lg">Buka Laporan</h2>
                    <p class="text-xs opacity-80">Buka Spreadsheet Rekapitulasi</p>
                </div>
            </div>
            <i class="fa-solid fa-arrow-up-right-from-square opacity-50"></i>
        </a>

        <!-- Tombol 4: Restart Server -->
        <button onclick="sendAction('RESTART_BOT')" class="card btn-danger w-full p-5 rounded-2xl shadow-sm flex items-center justify-between transition-all mt-4">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 rounded-full bg-white/20 flex items-center justify-center text-xl">
                    <i class="fa-solid fa-power-off"></i>
                </div>
                <div class="text-left">
                    <h2 class="font-bold text-lg">Restart Mesin</h2>
                    <p class="text-xs opacity-80">Mulai ulang server bot jika error</p>
                </div>
            </div>
        </button>

    </div>

    <!-- Footer -->
    <div class="mt-auto pt-8 pb-4 opacity-50 text-xs text-center">
        Powered by Dokploy & Antigravity
    </div>

    <script>
        // Inisialisasi Telegram WebApp
        const tg = window.Telegram.WebApp;
        
        // Memaksa WebApp untuk tampil full screen
        tg.expand();
        
        // Memberitahu Telegram bahwa app sudah siap
        tg.ready();

        // Mengambil data user yang membuka WebApp (Jika ada)
        const user = tg.initDataUnsafe?.user;
        if (user) {
            document.getElementById('user-info').innerText = `Halo, ${user.first_name}!`;
        } else {
            document.getElementById('user-info').innerText = "Mode Eksternal (Luar Telegram)";
        }

        // Fungsi untuk mengirim aksi kembali ke Bot Telegram
        function sendAction(actionType) {
            // Memberikan efek getar halus di HP saat tombol dipencet
            tg.HapticFeedback.impactOccurred('light');

            // Menyiapkan data JSON untuk dikirim ke bot
            const data = JSON.stringify({
                action: actionType,
                timestamp: new Date().toISOString()
            });

            // Mengirim data ke bot (Telegram akan otomatis menutup WebApp)
            if (tg.initDataUnsafe?.query_id) {
                tg.sendData(data);
                // Jika ingin WebApp langsung tertutup:
                // tg.close();
            } else {
                alert(`[Mode Uji Coba]\nTombol ditekan: ${actionType}\n\nDi Telegram asli, ini akan otomatis menutup layar dan memerintahkan robot.`);
            }
        }
    </script>
</body>
</html>
